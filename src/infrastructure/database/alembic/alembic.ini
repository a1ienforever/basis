# Run from the project root:
#   alembic -c src/infrastructure/database/alembic/alembic.ini upgrade head

[alembic]
script_location = %(here)s
# project root, so that `import src...` works in env.py
prepend_sys_path = %(here)s/../../../..
path_separator = os
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url is not set here: env.py takes it from src.config.Settings

# logging is configured in env.py via src.infrastructure.logging.setup_logging (LOG_* in .env)
