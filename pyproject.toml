[project]
name = "basis"
version = "0.1.0"
description = "Microservice skeleton: FastAPI + PostgreSQL + FastStream[rabbit] + Alembic"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "asyncpg>=0.31",
    "fastapi>=0.142",
    "faststream[rabbit]>=0.7.7",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
